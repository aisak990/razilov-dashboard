const k = (n: number | null) => (n === null ? "--" : "$" + Math.round(n / 1000) + "K");
const listed = props.filter((p) => p.views !== null);

function smooth(pts: [number, number][]) {
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function Area({ values, labels, color, id, fmt }: { values: number[]; labels: string[]; color: string; id: string; fmt: (n: number) => string }) {
  const W = 800, H = 240, l = 48, r = 16, t = 16, b = 36;
  const max = Math.max(...values) * 1.15;
  const pts: [number, number][] = values.map((v, i) => [l + (i * (W - l - r)) / (values.length - 1), t + (1 - v / max) * (H - t - b)]);
  const line = smooth(pts);
  const area = `${line} L${pts[pts.length - 1][0]},${H - b} L${pts[0][0]},${H - b} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
      <defs>
        <linearGradient id={id} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={color} stopOpacity={0.35} />
          <stop offset="1" stopColor={color} stopOpacity={0} />
        </linearGradient>
      </defs>
      {[0, 0.25, 0.5, 0.75, 1].map((f) => (
        <g key={f}>
          <line x1={l} x2={W - r} y1={t + f * (H - t - b)} y2={t + f * (H - t - b)} stroke={C.line} strokeDasharray="4 6" />
          <text x={l - 10} y={t + f * (H - t - b) + 4} textAnchor="end" fontSize={12} fill={C.faint}>{fmt(Math.round(max * (1 - f)))}</text>
        </g>
      ))}
      <path d={area} fill={`url(#${id})`} />
      <path d={line} fill="none" stroke={color} strokeWidth={3} />
      {pts.map((p, i) => (
        <g key={i}>
          <circle cx={p[0]} cy={p[1]} r={4} fill={C.bg} stroke={color} strokeWidth={2} />
          <text x={p[0]} y={p[1] - 12} textAnchor="middle" fontSize={12} fill={C.ink}>{fmt(values[i])}</text>
          <text x={p[0]} y={H - 12} textAnchor="middle" fontSize={12} fill={C.dim}>{labels[i]}</text>
        </g>
      ))}
    </svg>
  );
}

function Spark({ values, color }: { values: number[]; color: string }) {
  const W = 90, H = 30, max = Math.max(...values, 1);
  const pts: [number, number][] = values.map((v, i) => [(i * W) / (values.length - 1), H - 4 - (v / max) * (H - 8)]);
  return (
    <svg width="90" height="30" viewBox={`0 0 ${W} ${H}`} style={{ flexShrink: 0 }}>
      <path d={smooth(pts)} fill="none" stroke={color} strokeWidth={2} />
    </svg>
  );
}

function Donut() {
  const groups = (["uc", "offer", "active", "off"] as Group[]).map((g) => ({ g, n: props.filter((p) => p.group === g).length }));
  const R = 70, sw = 26, circ = 2 * Math.PI * R;
  let acc = 0;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 24 }}>
      <svg width="180" height="180" viewBox="0 0 180 180">
        <g transform="translate(90,90) rotate(-90)">
          {groups.map(({ g, n }) => {
            const len = (n / 8) * circ;
            const el = <circle key={g} r={R} fill="none" stroke={GROUP[g].color} strokeWidth={sw} strokeDasharray={`${Math.max(len - 3, 0)} ${circ}`} strokeDashoffset={-acc} />;
            acc += len;
            return el;
          })}
        </g>
        <text x={90} y={88} textAnchor="middle" fontSize={30} fontWeight={700} fill={C.ink}>2/8</text>
        <text x={90} y={108} textAnchor="middle" fontSize={11} fill={C.dim}>UNDER CONTRACT</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, flex: "1 1 140px" }}>
        {groups.map(({ g, n }) => (

            <span style={{ color: C.ink, fontWeight: 600 }}>{n}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

}

  return (

}

                    <div key={p.addr} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
                      <span style={{ fontSize: 12, color: C.ink }}>{p.showings}</span>
                      <div style={{ width: "70%", height: `${Math.max(p.showings / 3, 0.03) * 120}px`, borderRadius: 6, background: `linear-gradient(180deg, ${C.purple}, ${C.blue})` }} />
                      <span style={{ fontSize: 10, color: C.dim, textAlign: "center" }}>{p.short.replace(/^\d+ /, "")}</span>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize: 12, color: C.faint, marginTop: 10 }}>Counted from feedback emails. Showings with no feedback don't appear.</div>
              </Card>
              <Card title="Latest Feedback" right={<span style={pill}>6 notes</span>}>
                {[
                  ["2 Hollywood · Oct 24", "Sean Onal: interest level Very", C.green],
                  ["2 Hollywood · Oct 23", "Garcia Realtors: No, price too high, not mortgage ready", C.faint],
                  ["2 Hollywood · Oct 12", "Sean Onal: interest level Somewhat", C.purple],
                  ["32 Elm · Oct 9", "McDevitt (Redfin): interest level Somewhat", C.purple],
                  ["14 Mechanics · Nov 2", "Chris Carter (HomeSmart): Maybe", C.purple],
                  ["14 Mechanics · Oct 30", "Jose Rodriguez (Garcia Realtors): No", C.faint],
                ].map(([t, d, c], i) => (
                  <div key={i} style={{ display: "flex", gap: 10, padding: "9px 0", borderTop: i ? `1px solid ${C.line}` : "none" }}>
                    <span style={{ width: 4, borderRadius: 4, background: c }} />
                    <div>
                      <div style={{ fontSize: 13 }}>{t}</div>
                      <div style={{ fontSize: 12, color: C.dim }}>{d}</div>
                    </div>
                  </div>
                ))}
              </Card>
            </div>
          ) : null}

          {show("properties") ? (
            <Card title="All Properties" right={
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {(["all", "uc", "offer", "active", "off"] as (Group | "all")[]).map((g) => (
                  <button key={g} onClick={() => setFilter(g)} style={{ ...pill, background: filter === g ? C.purple + "33" : C.panel2, borderColor: filter === g ? C.purple : C.line }}>{g === "all" ? "All" : GROUP[g].label}</button>
                ))}
              </div>
            }>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 820 }}>
                  <thead>
                    <tr>
                      {["Address", "Occupancy", "Co-agent", "Status", "Sale", "Offer", "Date CL", "Views", "Saves", "Showings", "DOM", "MLS #"].map((h, i) => (
                        <th key={h} style={{ textAlign: i < 4 || i === 5 ? "left" : "right", color: C.faint, fontWeight: 500, padding: "8px 10px", borderBottom: `1px solid ${C.line}`, whiteSpace: "nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((p) => (
                      <tr key={p.addr}>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}` }}>
                          <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 99, background: GROUP[p.group].color, marginRight: 8 }} />{p.addr}
                        </td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, color: C.dim }}>{p.occ}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, color: C.dim }}>{p.coAgent || "None"}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, color: GROUP[p.group].color }}>{p.status}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right" }}>{money(p.sale)}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, color: C.dim }}>{p.offer}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right" }}>{p.closeDate || "None"}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right" }}>{p.views ?? "--"}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right" }}>{p.saves ?? "--"}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right" }}>{p.showings}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right" }}>{p.dom ?? "--"}</td>
                        <td style={{ padding: "11px 10px", borderBottom: `1px solid ${C.line}`, textAlign: "right", color: C.dim }}>{p.mls}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          ) : null}

          {show("properties") ? (
            <Card title="Sale Price by Property" right={<span style={pill}>From your sheet</span>}>
              {props.filter((p) => p.sale !== null).sort((a, b) => (b.sale ?? 0) - (a.sale ?? 0)).map((p) => (
                <div key={p.addr} style={{ display: "flex", alignItems: "center", gap: 12, padding: "7px 0" }}>
                  <span style={{ width: 110, fontSize: 13, color: C.dim, flexShrink: 0 }}>{p.short}</span>
                  <div style={{ flex: 1, height: 10, borderRadius: 99, background: C.line }}>
                    <div style={{ width: `${((p.sale ?? 0) / 250000) * 100}%`, height: "100%", borderRadius: 99, background: GROUP[p.group].color }} />
                  </div>
                  <span style={{ width: 56, textAlign: "right", fontSize: 13 }}>{k(p.sale)}</span>
                </div>
              ))}
            </Card>
          ) : null}
        </main>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
